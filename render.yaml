# Render Blueprint for the backend API. See DEPLOY.md.
services:
  - type: web
    name: eazyhall-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEMO_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      # Filled in on the Render dashboard (never committed):
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
